worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream api_gateway {
        server api_gateway1:8080;
        server api_gateway2:8080;
    }

    upstream resizer_image {
        server resizer_image1:8080;
        server resizer_image2:8080;
    }

    upstream rotator_image {
        server rotator_image1:8080;
        server rotator_image2:8080;
    }

    server {
        listen 80;

        location /api-gateway {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /resizer-image {
            proxy_pass http://resizer_image;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /rotator-image {
            proxy_pass http://rotator_image;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}